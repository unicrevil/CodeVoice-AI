<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNAT SECURITY AI</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0}
h1{font-size:28px;letter-spacing:4px;text-shadow:0 0 12px #0f0;text-align:center}
.sub{font-size:10px;color:#666;margin-bottom:20px;text-align:center}
.box{background:#0a0a0a;border:1px solid #0f0;padding:20px;width:92%;max-width:360px;text-align:center}
input{width:100%;padding:12px;background:#000;border:1px solid #fff;color:#fff;text-align:center;margin-top:10px;font-family:monospace;font-size:16px}
button{width:100%;padding:12px;background:#0f0;color:#000;border:none;font-weight:bold;margin-top:12px;font-family:monospace}
.report{border:1px solid #333;padding:6px;margin:5px 0;text-align:left;font-size:11px;background:#000}
#chat{position:fixed;bottom:50px;left:0;right:0;height:25vh;background:#000000ee;border-top:1px solid #222;padding:8px;font-size:11px;overflow:auto;display:none;white-space:pre-wrap}
#cmd{position:fixed;bottom:10px;left:5%;width:90%;padding:10px;background:#111;border:1px solid #0f0;color:#0f0;display:none}
</style></head><body>
<h1>DNAT SECURITY AI</h1>
<div class="sub">Desenvolvida por Thfwck00, Andre unic, Note e Pis3i<br>THE BEST SQUAD 2026</div>
<div class="box">
<div style="text-align:left;color:#0f0">$ init dnat-ai --ethical-mode</div>
<div style="text-align:left;color:#ff0;margin-top:10px">name is pentester:</div>
<input id="name" placeholder="Andre unic, Thfwck00, Note, Pis3i">
<div id="area" style="display:none;margin-top:12px"><div id="list"></div><div id="msg" style="margin-top:8px"></div></div>
<button id="btn">ENTER SYSTEM</button>
</div>
<div id="chat"></div>
<input id="cmd" placeholder="> help">

<script>
const founders=["thfwck00","note","pis3i","pisei"];
const reports=[{id:"4113932",t:"Report #4113932 successfully submitted",p:"HackerOne"},{id:"4113594",t:"[paypal] #4113594 Subdomain Takeover",p:"PayPal"},{id:"4113379",t:"[tiktok] #4113379 Unauthenticated",p:"TikTok"}];
const nameEl=document.getElementById('name'), area=document.getElementById('area'), list=document.getElementById('list'), msg=document.getElementById('msg'), chat=document.getElementById('chat'), cmd=document.getElementById('cmd');
function add(x){chat.style.display='block';chat.innerHTML+="\n"+x+"\n";chat.scrollTop=chat.scrollHeight}
document.getElementById('btn').onclick=()=>{
  let n=nameEl.value.trim(); if(!n) n="Guest"; let l=n.toLowerCase(); area.style.display='block';
  if(founders.includes(l)){
    list.innerHTML='<div class="report">FOUNDER - THE BEST SQUAD<br>'+n+' - Acesso total</div>';
    msg.innerHTML='<span style="color:#ff0">FOUNDER Verified: '+n+'</span>';
    add('[DNAT] FOUNDER '+n+' - acesso total liberado sem reports');
  } else if(l.includes('andre')){
    list.innerHTML=reports.map(r=>'<div class="report">'+r.t+'<br><span style="color:#666">'+r.p+'</span></div>').join('');
    msg.innerHTML='<span style="color:#ff0">Verified Researcher: '+n+'</span><br>3 reports';
    add('[DNAT] Andre unic autenticado - Reports 4113932, 4113594 PayPal, 4113379 TikTok');
  } else {
    list.innerHTML='<div class="report">Visitante: '+n+'</div>'; msg.innerHTML='Visitante';
    add('[DNAT] Visitante '+n);
  }
  setTimeout(()=>{cmd.style.display='block';add('[DNAT SECURITY AI] Online - '+n);},700);
};
</script></body></html>
