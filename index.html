<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNAT SECURITY AI - THE BEST SQUAD</title>
<style>
body{margin:0;background:#000;color:#00ff41;font-family:'Courier New',monospace}
#splash{position:fixed;inset:0;background:radial-gradient(#001100,#000);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;text-align:center}
#splash h1{font-size:15px;line-height:2;text-shadow:0 0 10px #00ff41}
#chat{padding:20px;height:75vh;overflow-y:auto}
#input{width:90%;margin:10px 5%;background:#111;border:1px solid #00ff41;color:#00ff41;padding:12px;border-radius:5px}
.logo{font-size:40px;margin-bottom:20px}

</head>
<body>
<div id="splash">
<div class="logo">👑 DNAT SECURITY LAB</div>
<h1>
[INITIALIZING SABO-X BRAIN...]<br><br>
Desenvolvida pela DNAT SECURITY -<br>
Thfwck00, André unic, Note e Pis3i.<br><br>
© 2026 DNAT SECURITY - THE BEST SQUAD<br>
THE BEST TRIO + NOTE = UNSTOPPABLE
</h1>
<p style="margin-top:20px;font-size:11px">[SISTEMA PROTEGIDO POR COPYRIGHT DNAT]</p>
</div>
<div id="chat"></div>
<input id="input" placeholder="> Digite seu comando SOC aqui...">
<script>
setTimeout(()=>{document.getElementById('splash').style.display='none'},4000);
const chat=document.getElementById('chat');
const inp=document.getElementById('input');
inp.addEventListener('keypress',e=>{
 if(e.key==='Enter'&&inp.value.trim()!=''){
  chat.innerHTML+=`<p style="color:#fff">[ANDRE]: ${inp.value}</p>`;
  chat.innerHTML+=`<p>[DNAT-AI]: 🛡️ Comando recebido pelo squad. Módulo Purple Team em construção... Integrado à ISO 463MB</p>`;
  chat.scrollTop=chat.scrollHeight;
  inp.value='';
 }
});
console.log("DNAT SECURITY © 2026 - Thfwck00, André unic, Note e Pis3i");
</script>
</body>
</html>
