<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNAT SECURITY AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#00ff41;font-family:monospace;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
h1.main{font-size:32px;letter-spacing:5px;color:#00ff41;text-shadow:0 0 15px #00ff41;margin-bottom:5px}
p.sub{font-size:10px;color:#666;margin-bottom:25px;text-align:center}
#loginBox{background:#0a0a0a;border:1px solid #00ff41;padding:20px;width:92%;max-width:360px;text-align:center;box-shadow:0 0 20px #00ff4111}
.term{color:#00ff41}.dim{color:#666}.alert{color:#ff0}
input.namebox{background:#000;border:1px solid #fff;color:#fff;padding:14px;width:100%;text-align:center;margin-top:12px;font-family:monospace;font-size:16px}
button{background:#00ff00;color:#000;border:none;padding:14px 0;width:100%;font-weight:bold;margin-top:14px;font-family:monospace;font-size:16px;cursor:pointer}

#input{position:fixed;bottom:10px;left:5%;width:90%;background:#111;border:1px solid #00ff41;color:#00ff41;padding:12px;display:none}
</style></head><body>
<h1 class="main">DNAT SECURITY AI</h1>
<p class="sub">Desenvolvida por Thfwck00, André unic, Note e Pis3i<br>THE BEST SQUAD © 2026</p>

<div id="loginBox">

<div style="margin-top:15px;color:#ff0;text-align:left">name is pentester:</div>

<div id="reportsArea" style="display:none;margin-top:15px"><div id="reportsList"></div><div id="welcomeMsg" style="margin-top:10px"></div></div>

</div>

<div id="chat"></div>

<script>
const chat=document.getElementById('chat'), inp=document.getElementById('input');
const nameInput=document.getElementById('pentesterName'), reportsArea=document.getElementById('reportsArea'), reportsList=document.getElementById('reportsList');
let cur="";
const db={"andré unic":[{"id":"4113932","title":"Report #4113932 successfully submitted","prog":"HackerOne"},{"id":"4113594","title":"[paypal] #4113594: Subdomain Takeover","prog":"PayPal"},{"id":"4113379","title":"[tiktok] #4113379: Unauthenticated /api/op...","prog":"TikTok"}],"andre unic":[{"id":"4113932","title":"Report #4113932 successfully submitted","prog":"HackerOne"},{"id":"4113594","title":"[paypal] #4113594: Subdomain Takeover","prog":"PayPal"},{"id":"4113379","title":"[tiktok] #4113379: Unauthenticated /api/op...","prog":"TikTok"}]};
function add(t){chat.style.display='block';chat.innerHTML+="\n"+t+"\n";chat.scrollTop=chat.scrollHeight}
document.getElementById('enterBtn').onclick=()=>{
 const name=nameInput.value.trim()||"Guest"; cur=name.toLowerCase(); reportsArea.style.display='block';
 const reports=db[cur]||[]; 
 if(cur.includes("andre")||cur.includes("andré")){
  reportsList.innerHTML=reports.map(r=>`<div class="report">📧 ${r.title}<br><span style="color:#666">${r.prog}</span></div>`).join('');
  document.getElementById('welcomeMsg').innerHTML=`<span style="color:#ff0">✅ Verified: ${name}</span><br><span style="color:#00ff41">${reports.length} reports HackerOne encontrados</span>`;
  add(`[DNAT-AI] 🔓 ${name} autenticado\n📂 #4113932, #4113594 PayPal, #4113379 TikTok`);
 }else{reportsList.innerHTML=`<div class="report">👤 ${name}</div>`;add(`[DNAT-AI] Visitante: ${name}`);}
 setTimeout(()=>{inp.style.display='block';inp.placeholder=`> help - ${name}`;add(`[DNAT SECURITY AI] Pronta, ${name}. Digite 'help'`);},800);
};
</script></body></html>
