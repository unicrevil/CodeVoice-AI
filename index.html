<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNAT SECURITY AI</title>
<style>
html,body{margin:0;background:#000;color:#0f0;font-family:monospace;height:100%}
.header{text-align:center;padding:18px 0;background:#000;position:sticky;top:0;border-bottom:1px solid #0f0}
.header h1{margin:0;font-size:22px;letter-spacing:2px;text-shadow:0 0 12px #0f0}
.header p{margin:2px;font-size:11px;color:#0a0}
.terminal{width:92%;max-width:650px;margin:15px auto;border:1px solid #0f0;border-radius:8px;padding:15px;background:#050505;min-height:70vh}
input{width:95%;background:#000;color:#0f0;border:1px solid #0f0;padding:10px;border-radius:4px;outline:none;margin-top:8px}
#chat{display:none;margin-top:20px;border-top:1px dashed #0f0;padding-top:15px}
.msg{margin:8px 0;padding:8px;border-radius:4px;font-size:13px;white-space:pre-wrap}
.user{background:#0f0;color:#000;text-align:right}
.ai{background:#111;border:1px solid #0f0}
.help{text-align:center;color:#0f0;margin:15px;border:1px solid #222;padding:10px;border-radius:6px}
</style>
</head>
<body>
<div class="header">
<h1>DNAT SECURITY AI</h1>
<p>Desenvolvida por Thfwck00, Andre unic, Note e Pis3i</p>
<p>THE BEST SQUAD 2026</p>
</div>
<div class="terminal">
<div>$ init dnat-ai --ethical-mode</div>
<div>name is pentester:</div>
<input id="nameInput" placeholder="Digite: Thfwck00 ou Andre unic">
<div id="authOut" style="margin-top:15px;white-space:pre-wrap;font-size:13px;color:#0f0"></div>

<div id="chat">
<div style="color:#0f0">[DNAT AI] Online. Como posso ajudar no pentest hoje?</div>
<div id="chatBox" style="max-height:300px;overflow:auto;margin:10px 0"></div>
<input id="chatInput" placeholder="Pergunte pra IA: ex: analisa meu report paypal">
</div>
</div>
<div class="help">Help</div>
<script>
const founders=["Thfwck00","Note","Pis3i"];
const verified={"Andre unic":["4113932","4113594","4113379"],"André unic":["4113932","4113594","4113379"]};
let currentUser=null;
const nameInput=document.getElementById('nameInput');
const authOut=document.getElementById('authOut');
const chat=document.getElementById('chat');
const chatBox=document.getElementById('chatBox');
const chatInput=document.getElementById('chatInput');

nameInput.addEventListener('keydown',e=>{
 if(e.key==='Enter'){
  let n=nameInput.value.trim(); if(!n) return;
  if(founders.includes(n) || verified[n]){
   currentUser=n;
   let r = verified[n]? verified[n].join(', ') : 'FOUNDER ACCESS';
   authOut.innerText = `Report #4113932 successfully submitted\n[paypal] #4113594 Subdomain Takeover\n[tiktok] #4113379 Unauthenticated\n\n[DNAT] ${n} autenticado - Reports ${r}\n[DNAT SECURITY AI] Online - ${n} - Chat liberado abaixo ↓`;
   chat.style.display='block';
   chatInput.focus();
   window.scrollTo(0,document.body.scrollHeight);
  } else {
   authOut.innerText=`[${n}] Acesso negado. Use um nome da THE BEST SQUAD`;
  }
 }
});

function aiReply(q){
 q=q.toLowerCase();
 if(q.includes('paypal')) return `[DNAT AI] Analisando Report #4113594 PayPal:\n> Subdomain Takeover confirmado.\n> Payload: CNAME dangling em shop.paypal.com -> S3 bucket não reclamado.\n> Impacto: Alto. Recomendo PoC com dig + curl.\n> Quer que eu gere o payload pro HackerOne?`;
 if(q.includes('tiktok')) return `[DNAT AI] Report #4113379 TikTok:\n> Endpoint /api/user/email sem auth.\n> IDOR permitindo vazar email.\n> Status: Triaged. Quer template de relatório?`;
 if(q.includes('report')||q.includes('4113932')) return `[DNAT AI] Report #4113932:\n> Validado com sucesso no HackerOne.\n> Parabéns ${currentUser}, você é Verified Researcher.\n> The Best Squad 2026`;
 if(q.includes('help')||q.includes('comando')) return `[DNAT AI] Comandos:\n- analisa paypal\n- analisa tiktok\n- gera payload\n- template hackerone\n- quem é founder`;
 return `[DNAT AI] Entendi: "${q}"\n> Como IA ética de pentest, posso te ajudar a validar subdomínios, gerar PoC, e escrever reports.\n> Digite "analisa paypal" pra teste.`;
}

chatInput.addEventListener('keydown',e=>{
 if(e.key==='Enter'){
  let q=chatInput.value.trim(); if(!q) return;
  let u=document.createElement('div'); u.className='msg user'; u.innerText=q; chatBox.appendChild(u);
  let a=document.createElement('div'); a.className='msg ai'; a.innerText='[DNAT AI] digitando...'; chatBox.appendChild(a);
  chatBox.scrollTop=chatBox.scrollHeight;
  setTimeout(()=>{a.innerText=aiReply(q); chatBox.scrollTop=chatBox.scrollHeight;},700);
  chatInput.value='';
 }
});
window.onload=()=>{window.scrollTo(0,0);nameInput.focus()};
</script>
</body>
</html>
