<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNAT SECURITY AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#00ff41;font-family:monospace;height:100vh;display:flex;flex-direction:column}
#header{text-align:center;padding:20px 10px;border-bottom:1px solid #111}
#header h1{font-size:28px;letter-spacing:4px;color:#00ff41;text-shadow:0 0 10px #00ff41}
#header p{font-size:10px;color:#666;margin-top:8px;letter-spacing:1px}
#center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
#loginBox{background:#0a0a0a;border:1px solid #00ff41;padding:20px;width:95%;max-width:350px;text-align:center}
.term{color:#00ff41}.dim{color:#666}.alert{color:#ff0}
input.namebox{background:#000;border:1px solid #00ff41;color:#00ff41;padding:12px;width:100%;text-align:center;margin-top:12px;font-family:monospace}
button{background:#00ff41;color:#000;border:none;padding:10px 0;width:100%;font-weight:bold;margin-top:12px;font-family:monospace;cursor:pointer}
#reportsList{text-align:left;margin-top:15px;font-size:11px}
.report{border:1px solid #222;background:#000;padding:8px;margin:6px 0}
#chat{height:35vh;overflow-y:auto;padding:10px;border-top:1px solid #111;font-size:12px;white-space:pre-wrap}
#input{width:95%;margin:10px auto;display:block;background:#111;border:1px solid #00ff41;color:#00ff41;padding:12px}
</style></head><body>

<div id="header">
<h1>DNAT SECURITY AI</h1>
<p>Desenvolvida por Thfwck00, André unic, Note e Pis3i - THE BEST SQUAD © 2026</p>
</div>

<div id="center">
<div id="loginBox">
<span class="alert">name is pentester:</span>
<input id="pentesterName" class="namebox" placeholder="André unic">
<div id="reportsArea" style="display:none">
<div id="reportsList"></div>
<div id="welcomeMsg" style="margin-top:10px;font-size:12px"></div>
</div>
<button id="enterBtn">ENTER SYSTEM</button>
<p style="font-size:9px;color:#444;margin-top:12px">Modo ético: print HackerOne/Bugcrowd obrigatório para scan</p>
</div>
</div>

<div id="chat">[SYSTEM] Aguardando login de pesquisador...</div>
<input id="input" placeholder="> Digite seu comando SOC aqui..." disabled>

<script>
const chat=document.getElementById('chat'), inp=document.getElementById('input');
const nameInput=document.getElementById('pentesterName'), reportsArea=document.getElementById('reportsArea');
const reportsList=document.getElementById('reportsList');
let currentPentester="";
const db={"andre unic":[
{id:"4113932",title:"Report #4113932 successfully submitted",prog:"HackerOne Core"},
{id:"4113594",title:"[paypal] #4113594: Subdomain Takeover",prog:"PayPal"},
{id:"4113379",title:"[tiktok] #4113379: Unauthenticated /api/op...",prog:"TikTok"}]};
function add(t){chat.innerHTML+="\n"+t+"\n";chat.scrollTop=chat.scrollHeight}
document.getElementById('enterBtn').onclick=()=>{
 const name=nameInput.value.trim()||"Guest"; currentPentester=name.toLowerCase();
 reportsArea.style.display='block';
 const reports=db[currentPentester]||[];
 if(currentPentester.includes("andre")){
  reportsList.innerHTML=reports.map(r=>`<div class="report">📧 ${r.title}<br><span class="dim">${r.prog}</span></div>`).join('');
  document.getElementById('welcomeMsg').innerHTML=`<span class="alert">✅ Verified: ${name}</span><br><span class="term">${reports.length} reports encontrados</span>`;
  add(`[DNAT-AI] 🔓 ${name} autenticado\n📂 Reports: #4113932, #4113594 PayPal, #4113379 TikTok`);
 } else {
  reportsList.innerHTML=`<div class="report">👤 ${name} - visitante</div>`;
  add(`[DNAT-AI] Visitante: ${name}`);
 }
 setTimeout(()=>{document.getElementById('center').style.display='none';inp.disabled=false;inp.placeholder=`> help | scan | relatorio - ${name}`;add(`[DNAT-AI] DNAT SECURITY AI pronta. Digite 'help'`);},1200);
};
inp.addEventListener('keypress',e=>{if(e.key==='Enter'&&inp.value){add(`[${currentPentester.toUpperCase()||'PENTESTER'}]: ${inp.value}`);if(inp.value.toLowerCase().includes('help'))add(`[DNAT-AI] COMANDOS:\n- scan headers [URL]\n- meus reports\n- gerar relatorio`);else if(inp.value.toLowerCase().includes('report'))add(`[DNAT-AI] ${reportsList.innerHTML.replace(/<[^>]*>/g,'')}`);else add(`[DNAT-AI] Recebido: ${inp.value}`);inp.value='';}});
</script></body></html>
